<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WARM. New York</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.2)), url("warm.jpeg") center / cover no-repeat;
      filter: blur(18px) saturate(0.9);
      transform: scale(1.08);
    }

    .banner {
      width: min(100vw, calc(100dvh * 1.499));
      height: auto;
      max-height: 100dvh;
      object-fit: contain;
      display: block;
      position: relative;
      z-index: 1;
    }

    @supports not (height: 100dvh) {
      .banner {
        width: min(100vw, calc(100vh * 1.499));
        max-height: 100vh;
      }
    }
  </style>
</head>
<body>
  <img class="banner" src="warm.jpeg" alt="WARM. New York - Coming Soon" />
</body>
</html>
