<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WARM. New York</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    picture,
    img {
      display: block;
      width: 100%;
      height: 100%;
    }

    picture {
      position: fixed;
      inset: 0;
    }

    .banner {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      object-position: center;
    }
  </style>
</head>
<body>
  <picture>
    <source media="(max-width: 767px)" srcset="warm-mob.png" />
    <source media="(min-width: 768px)" srcset="warm-web.png" />
    <img class="banner" src="warm-web.png" alt="WARM. New York - Coming Soon" />
  </picture>
</body>
</html>
