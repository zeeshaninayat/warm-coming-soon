<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WARM. New York</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .banner {
      display: block;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      object-position: center;
    }

  </style>
</head>
<body>
  <video class="banner" autoplay muted loop playsinline preload="auto" aria-label="WARM. New York campaign video">
    <source src="warm-video.MP4" type="video/mp4" />
    Your browser does not support embedded video.
  </video>
</body>
</html>
